# setup-workspace pytest 套件工具链（spec 20261110-d145 批 1）。
# 运行时依赖只有 pytest：等价索引、双跑对照、oseq 黄金回放全部用标准库。
# 首次需联网 `uv sync` 一次，此后 `uv sync --offline` 可重复（need A2 双约束）。
# 入口两级：本目录内 `uv run pytest`；仓库根
# `uv run --project skills/setup-workspace/tests pytest skills/setup-workspace/tests`。
[project]
name = "sdlc-setup-workspace-tests"
version = "0.1.0"
description = "setup-workspace 门禁引擎 pytest 测试套件（uv 锁定环境）"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["."]
